name: Generate v1 XML Sitemap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sitemap_generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Debug - List files
        run: |
          echo "Current directory structure:"
          ls -R
          # v1 폴더가 있는지, 그 안에 .html이 있는지 확인하는 단계입니다.

      - name: Generate Sitemap for v1
        uses: cicirello/generate-sitemap@v1
        continue-on-error: true # 오류 발생 시 로그만 남기고 중단 방지
        with:
          base-url-path: https://c2i.kr/v1/
          path-to-root: v1
          sitemap-format: xml

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # sitemap.xml이 생성되었는지 체크
          if [ -f sitemap.xml ]; then
            git add sitemap.xml
            git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update for v1" && git push)
            echo "Sitemap updated successfully."
          else
            echo "Error: sitemap.xml was not generated. Please check if 'v1' directory contains .html files."
            exit 1
          fi

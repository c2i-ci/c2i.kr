name: Generate XML Sitemap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sitemap_generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Manual Sitemap Generation
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          
          # v1 폴더 내의 모든 .html 파일을 찾아 loc 태그로 변환
          find v1 -name "*.html" | while read file; do
            echo "  <url>" >> sitemap.xml
            echo "    <loc>https://c2i.kr/$file</loc>" >> sitemap.xml
            echo "    <lastmod>$(date +%Y-%m-%d)</lastmod>" >> sitemap.xml
            echo "  </url>" >> sitemap.xml
          done
          
          echo '</urlset>' >> sitemap.xml

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update" && git push)

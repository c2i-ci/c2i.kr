name: Generate XML Sitemap

on:
  push:
    branches:
      - main  # 배포 브랜치 이름이 master라면 master로 수정하세요.

permissions:
  contents: write  # 파일을 생성하고 push하기 위해 반드시 필요합니다.

jobs:
  sitemap_generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Generate Sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://c2i.kr/  # 본인의 도메인 주소

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update" && git push)

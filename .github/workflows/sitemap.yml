name: Generate v1 XML Sitemap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sitemap_generator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      # 1. 디버깅: 실제 파일 구조를 로그에 기록 (문제가 생기면 Action 탭에서 확인 가능)
      - name: List Files for Verification
        run: |
          echo "Listing files in v1 directory:"
          ls -R v1 || echo "v1 directory not found!"

      # 2. 사이트맵 생성 (v1 전용)
      - name: Generate Sitemap for v1
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://c2i.kr/
          path-to-root: v1
          sitemap-format: xml
          # v1 안에 html이 없을 수도 있으므로, 다른 확장자들을 명시합니다.
          # 실제 v1 안에 있는 파일들의 확장자를 아래에 추가하세요.
          additional-extensions: pdf txt md png jpg
          # html이 아예 없는 경우 에러 방지
          include-html: true 

      # 3. 변경 사항 커밋 및 푸시
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # sitemap.xml 파일이 생성되었는지 최종 확인
          if [ -f sitemap.xml ]; then
            git add sitemap.xml
            # 변경사항이 있을 때만 커밋
            git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update for v1" && git push)
            echo "Sitemap.xml has been updated and pushed."
          else
            echo "Critical Error: sitemap.xml was not generated."
            echo "Check if the directory 'v1' exists and contains files with supported extensions."
            exit 1
          fi
